# This file is generated by Coolify, do not edit it manually.
# Disable the default redirect to customize (only if you know what are you doing).

http:
  routers:
    catchall:
      entryPoints:
        - https
      service: noop
      rule: PathPrefix(`/`)
      tls:
        certResolver: letsencrypt
      priority: -1000
      middlewares:
        - error-pages
    catchall-http:
      entryPoints:
        - http
      service: noop
      rule: PathPrefix(`/`)
      priority: -1000
      middlewares:
        - error-pages
  services:
    noop:
      loadBalancer:
        servers: {}
    error-pages:
      loadBalancer:
        servers:
          -
            url: 'http://coolify-proxy-error-pages:80'
  middlewares:
    error-pages:
      errors:
        status:
          - '503'
        service: error-pages
        query: /503.html
